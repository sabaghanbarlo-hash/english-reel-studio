name: Make reel

on:
  workflow_dispatch:
    inputs:
      script:
        description: English narration script (or a JSON shot list)
        required: true
        type: string
      voice:
        description: Narrator voice
        type: choice
        options: [en-US-AndrewNeural, en-US-AvaNeural, en-US-BrianNeural, en-US-EmmaNeural, en-US-GuyNeural, en-US-AriaNeural, en-GB-RyanNeural, en-GB-SoniaNeural]
        default: en-US-AndrewNeural
      caption:
        description: Caption (blank = AI-written)
        type: string
        default: ""
      hashtags:
        description: Hashtags separated by spaces (blank = AI-written)
        type: string
        default: ""
      after_render:
        description: What to do with the finished reel
        type: choice
        options: [render_only, queue_for_best_time, post_now]
        default: render_only

permissions:
  contents: write
  pages: write
  models: read

concurrency:
  group: make-reel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Caption font (Poppins ExtraBold)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Poppins-ExtraBold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-ExtraBold.ttf" \
            || echo "::warning::Could not download Poppins; falling back to a system bold font."

      - run: pip install -r requirements.txt

      - name: Render reel
        env:
          SCRIPT: ${{ inputs.script }}
          VOICE: ${{ inputs.voice }}
          CAPTION: ${{ inputs.caption }}
          HASHTAGS: ${{ inputs.hashtags }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m reel.run

      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14

      - name: Publish preview to the site
        if: ${{ inputs.after_render == 'render_only' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          python -m reel.queue preview

      - name: Add to the publishing queue
        if: ${{ inputs.after_render == 'queue_for_best_time' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          python -m reel.queue add

      - name: Post to Instagram (via Composio)
        if: ${{ inputs.after_render == 'post_now' }}
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          IG_ACCOUNT: ${{ vars.IG_ACCOUNT }}
          IG_EXPECT_USERNAME: ${{ vars.IG_EXPECT_USERNAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/post.sh
