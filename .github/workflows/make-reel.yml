name: Make reel

on:
  workflow_dispatch:
    inputs:
      script:
        description: Persian narration script (or a JSON shot list)
        required: true
        type: string
      voice:
        description: Narrator voice
        type: choice
        options: [fa-IR-DilaraNeural, fa-IR-FaridNeural]
        default: fa-IR-DilaraNeural
      visuals:
        description: Visual provider
        type: choice
        options: [pollinations, pexels]
        default: pollinations
      caption:
        description: Caption (blank = AI-written)
        type: string
        default: ""
      hashtags:
        description: Hashtags separated by spaces (blank = AI-written)
        type: string
        default: ""
      post_to_instagram:
        description: Post to Instagram after rendering (off = render only)
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  models: read

concurrency:
  group: make-reel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Persian font (Vazirmatn)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/Vazirmatn-Bold.ttf "https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/fonts/ttf/Vazirmatn-Bold.ttf" \
            || echo "::warning::Could not download Vazirmatn; falling back to Noto Sans Arabic."

      - run: pip install -r requirements.txt

      - name: Render reel
        env:
          SCRIPT: ${{ inputs.script }}
          VOICE: ${{ inputs.voice }}
          VISUALS: ${{ inputs.visuals }}
          CAPTION: ${{ inputs.caption }}
          HASHTAGS: ${{ inputs.hashtags }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m reel.run

      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 14

      - name: Post to Instagram (via Composio)
        if: ${{ inputs.post_to_instagram }}
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          IG_ACCOUNT: ${{ vars.IG_ACCOUNT }}
          IG_EXPECT_USERNAME: ${{ vars.IG_EXPECT_USERNAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/post.sh
